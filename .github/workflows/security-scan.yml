name: Shared Security Scan

on:
  workflow_call:
    inputs:
      fs_gate_severity:
        description: Severity gate for repository vulnerability scan.
        required: false
        type: string
        default: CRITICAL
      dependency_review_severity:
        description: Severity gate for dependency review.
        required: false
        type: string
        default: high
      checkov_version:
        description: checkov image tag used to scan configuration.
        required: false
        type: string
        default: 3.3.11
      checkov_config:
        description: checkov configuration, relative to the repository root. Owns the frameworks, the skipped paths and the waived checks.
        required: false
        type: string
        default: .checkov.yaml

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: helsinki
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: ${{ inputs.dependency_review_severity }}

  trivy-fs:
    name: Trivy FS
    runs-on: helsinki
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif

      - name: Gate repository vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          vuln-type: os,library
          severity: ${{ inputs.fs_gate_severity }}
          ignore-unfixed: true
          exit-code: '1'

  checkov:
    name: Checkov
    runs-on: helsinki
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Scan configuration
        env:
          CHECKOV_IMAGE: bridgecrew/checkov:${{ inputs.checkov_version }}
          CHECKOV_CONFIG: ${{ inputs.checkov_config }}
        run: |
          docker run --rm \
            -v "${PWD}:/repo" -w /repo \
            "$CHECKOV_IMAGE" \
            --config-file "$CHECKOV_CONFIG" \
            --output cli --output sarif \
            --output-file-path console,checkov.sarif

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
