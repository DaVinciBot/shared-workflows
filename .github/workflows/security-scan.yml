name: Shared Security Scan

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner the jobs run on, as a JSON array of labels. Defaults to the self-hosted runner of the
          organisation in Helsinki; pass another array, such as '["ubuntu-latest"]', for a job that
          really needs a GitHub-hosted VM.
        required: false
        type: string
        default: '["self-hosted", "helsinki"]'
      fs_gate_severity:
        description: Severity gate for repository vulnerability scan.
        required: false
        type: string
        default: CRITICAL
      dependency_review_severity:
        description: Severity gate for dependency review.
        required: false
        type: string
        default: high
      trivy_cache_dir:
        description: >-
          Persistent Trivy cache on the self-hosted runner. The vulnerability database weighs several hundred
          megabytes and is re-downloaded on every run without it. Ignored on a GitHub-hosted runner, where the
          directory would die with the VM and the action caches the database through GitHub instead.
        required: false
        type: string
        default: /home/gha-runner/trivy-cache
      checkov_version:
        description: checkov image tag used to scan configuration.
        required: false
        type: string
        default: 3.3.11
      checkov_config:
        description: checkov configuration, relative to the repository root. Owns the frameworks, the skipped paths and the waived checks.
        required: false
        type: string
        default: .checkov.yaml

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: ${{ inputs.dependency_review_severity }}

  trivy-fs:
    name: Trivy FS
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # La base Trivy vit sur le disque de la box et sert tous les repos : un run
      # ne la retélécharge plus, et les deux scans du job la partagent.
      - name: Resolve Trivy cache directory
        id: trivy_cache
        env:
          CACHE_ROOT: ${{ inputs.trivy_cache_dir }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_ENVIRONMENT" != "self-hosted" ]; then
            echo "Runner $RUNNER_ENVIRONMENT : cache Trivy jetable, cache GitHub."
            exit 0
          fi
          mkdir -p "$CACHE_ROOT"
          echo "TRIVY_CACHE_DIR=${CACHE_ROOT}" >> "$GITHUB_ENV"
          echo "local=true" >> "$GITHUB_OUTPUT"

      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          cache: ${{ steps.trivy_cache.outputs.local == 'true' && 'false' || 'true' }}

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif

      # Deuxième passe sur le même arbre : la base vient d'être mise à jour par
      # le scan précédent, la retélécharger serait du pur gaspillage.
      - name: Gate repository vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: 'true'
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          vuln-type: os,library
          severity: ${{ inputs.fs_gate_severity }}
          ignore-unfixed: true
          exit-code: '1'
          cache: ${{ steps.trivy_cache.outputs.local == 'true' && 'false' || 'true' }}

  checkov:
    name: Checkov
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Scan configuration
        env:
          CHECKOV_IMAGE: bridgecrew/checkov:${{ inputs.checkov_version }}
          CHECKOV_CONFIG: ${{ inputs.checkov_config }}
        run: |
          docker run --rm \
            -v "${PWD}:/repo" -w /repo \
            "$CHECKOV_IMAGE" \
            --config-file "$CHECKOV_CONFIG" \
            --output cli --output sarif \
            --output-file-path console,checkov.sarif

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
