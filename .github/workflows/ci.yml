name: Shared CI

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner the jobs run on, as a JSON array of labels. Defaults to the self-hosted runner of the
          organisation in Helsinki; pass another array, such as '["ubuntu-latest"]', for a job that
          really needs a GitHub-hosted VM.
        required: false
        type: string
        default: '["self-hosted", "helsinki"]'
      pnpm_version:
        description: pnpm version to install.
        required: false
        type: string
        default: '11.5.2'
      node_version_file:
        description: Node version file path.
        required: false
        type: string
        default: .nvmrc
      working_directory:
        description: >-
          Directory in which the quality-gate commands run. Dependencies are
          always installed from the repository root so pnpm workspaces link
          correctly; only the commands run here. Defaults to the repo root.
        required: false
        type: string
        default: '.'
      pnpm_store_dir:
        description: >-
          Persistent pnpm store on the self-hosted runner, shared by every repository — the store is
          content-addressed, so sharing it is what it is for. Ignored on a GitHub-hosted runner, where the
          store dies with the VM and setup-node caches it through GitHub instead.
        required: false
        type: string
        default: /home/gha-runner/pnpm-store
      install_filter:
        description: >-
          pnpm filter limiting the install to one workspace package and its workspace dependencies
          (a trailing '...' is appended). Empty installs the whole workspace.
        required: false
        type: string
        default: ''
      commands:
        description: >-
          JSON array of {name, command} objects to run as the quality-gate
          matrix. Use it to run only the scripts a given package actually
          defines. When empty, the default gates (check, lint, test:unit,
          build) run at the repository root.
        required: false
        type: string
        default: ''
    secrets:
      PACKAGES_READ_TOKEN:
        description: Token with read:packages used to install private @davincibot packages.
        required: false

permissions:
  contents: read

jobs:
  quality-gates:
    name: ${{ matrix.name }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.commands != '' && inputs.commands || '[{"name":"Typecheck","command":"pnpm check"},{"name":"Lint","command":"pnpm lint"},{"name":"Unit Tests","command":"pnpm test:unit"},{"name":"Build","command":"pnpm build"}]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm_version }}
          standalone: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node_version_file }}
          cache: ${{ runner.environment == 'self-hosted' && '' || 'pnpm' }}

      # Le store pnpm survit aux jobs sur la box : le cache réseau de GitHub ferait
      # un aller-retour de tarball par run pour un contenu déjà sur le disque. On le
      # laisse donc à setup-node uniquement quand le runner est jetable.
      - name: Resolve pnpm store
        id: store
        env:
          STORE_ROOT: ${{ inputs.pnpm_store_dir }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_ENVIRONMENT" != "self-hosted" ]; then
            echo "Runner $RUNNER_ENVIRONMENT : store jetable, cache GitHub."
            exit 0
          fi
          mkdir -p "$STORE_ROOT"
          echo "dir=${STORE_ROOT}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        env:
          NPM_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
          STORE_DIR: ${{ steps.store.outputs.dir }}
          INSTALL_FILTER: ${{ inputs.install_filter }}
        run: |
          set -euo pipefail
          args=(install --frozen-lockfile)
          if [ -n "${STORE_DIR:-}" ]; then
            args+=(--store-dir "$STORE_DIR")
          fi
          if [ -n "${INSTALL_FILTER:-}" ]; then
            args+=(--filter "${INSTALL_FILTER}...")
          fi
          pnpm "${args[@]}"

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
        working-directory: ${{ inputs.working_directory }}
