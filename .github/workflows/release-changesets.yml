name: Shared Release (changesets)

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner the jobs run on, as a JSON array of labels. Defaults to the self-hosted runner of the
          organisation in Helsinki; pass another array, such as '["ubuntu-latest"]', for a job that
          really needs a GitHub-hosted VM.
        required: false
        type: string
        default: '["self-hosted", "helsinki"]'
      pnpm_version:
        description: pnpm version to install.
        required: false
        type: string
        default: '11.5.2'
      node_version_file:
        description: Node version file path.
        required: false
        type: string
        default: .nvmrc
      pnpm_store_dir:
        description: >-
          Persistent pnpm store on the self-hosted runner, shared by every repository — the store is
          content-addressed, so sharing it is what it is for. Ignored on a GitHub-hosted runner, where the
          store dies with the VM.
        required: false
        type: string
        default: /home/gha-runner/pnpm-store
      version_script:
        description: Command run by changesets to apply the changesets and bump versions.
        required: false
        type: string
        default: pnpm changeset version
      pr_title:
        description: Title of the version PR.
        required: false
        type: string
        default: 'chore: version packages'
      commit_message:
        description: Commit message used on the version PR.
        required: false
        type: string
        default: 'chore: version packages'
    secrets:
      PACKAGES_READ_TOKEN:
        description: Token with read:packages, needed only to install private @davincibot dependencies from other repos.
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version Packages PR
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm_version }}
          standalone: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node_version_file }}

      # Le store pnpm survit aux jobs sur la box : le garder à demeure évite de
      # retélécharger le workspace à chaque « Version Packages ».
      - name: Resolve pnpm store
        id: store
        env:
          STORE_ROOT: ${{ inputs.pnpm_store_dir }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_ENVIRONMENT" != "self-hosted" ]; then
            echo "Runner $RUNNER_ENVIRONMENT : store jetable."
            exit 0
          fi
          mkdir -p "$STORE_ROOT"
          echo "dir=${STORE_ROOT}" >> "$GITHUB_OUTPUT"

      # `changeset version` ne fait que réécrire des package.json et des CHANGELOG :
      # aucun script de cycle de vie n'est nécessaire pour ça.
      - name: Install dependencies
        env:
          NPM_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
          STORE_DIR: ${{ steps.store.outputs.dir }}
        run: |
          set -euo pipefail
          args=(install --frozen-lockfile --ignore-scripts)
          if [ -n "${STORE_DIR:-}" ]; then
            args+=(--store-dir "$STORE_DIR")
          fi
          pnpm "${args[@]}"

      - uses: changesets/action@v2
        with:
          version-script: ${{ inputs.version_script }}
          pr-title: ${{ inputs.pr_title }}
          commit-message: ${{ inputs.commit_message }}
          github-token: ${{ github.token }}
